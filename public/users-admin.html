<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المستخدمين</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b141a;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: #202c33;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    h1, h2 {
      margin-top: 0;
    }

    p {
      color: #aebac1;
      line-height: 1.7;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111b21;
      color: white;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      background: #00a884;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .danger {
      background: #d93025;
    }

    .user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #111b21;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .userInfo {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-weight: bold;
      font-size: 17px;
    }

    .pass {
      color: #8696a0;
      font-size: 13px;
      margin-top: 4px;
    }

    .msg {
      margin-top: 10px;
      color: #00a884;
      font-weight: bold;
    }

    .toplink {
      display: inline-block;
      margin-bottom: 15px;
      color: #00a884;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="toplink" href="/">← الرجوع للمنصة</a>

    <div class="card">
      <h1>إدارة المستخدمين</h1>
      <p>اكتب كلمة مرور الأدمن لعرض وإضافة وحذف المستخدمين.</p>
      <input id="adminPassword" type="password" placeholder="كلمة مرور الأدمن" value="admin123" />
      <button onclick="loadUsers()">عرض المستخدمين</button>
      <div class="msg" id="mainMsg"></div>
    </div>

    <div class="card">
      <h2>إضافة مستخدم جديد</h2>
      <input id="newName" placeholder="اسم المستخدم" />
      <input id="newPhone" placeholder="رقم الهاتف" inputmode="tel" />
      <input id="newPassword" placeholder="كلمة المرور" />
      <button onclick="addUser()">إضافة / تحديث</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <h2>قائمة المستخدمين</h2>
      <div id="usersList"></div>
    </div>
  </div>

  <script>
    function admin() {
      return document.getElementById("adminPassword").value.trim();
    }

    function show(id, text) {
      document.getElementById(id).innerText = text;
      setTimeout(() => {
        document.getElementById(id).innerText = "";
      }, 3000);
    }

    async function loadUsers() {
      const res = await fetch("/api/users?admin=" + encodeURIComponent(admin()));
      const data = await res.json();

      if (!data.ok) {
        show("mainMsg", data.message || "فشل تحميل المستخدمين");
        return;
      }

      const box = document.getElementById("usersList");
      box.innerHTML = "";

      data.users.forEach(user => {
        const div = document.createElement("div");
        div.className = "user";

        div.innerHTML = `
          <div class="userInfo">
            <div class="name">${user.name}</div>
            <div class="pass">Phone: ${user.phone || "بدون رقم"}</div>
            <div class="pass">PIN: ${user.password || "بدون PIN"}</div>
          </div>
          <button class="danger" onclick="deleteUser('${encodeURIComponent(user.name)}')">حذف</button>
        `;

        box.appendChild(div);
      });

      show("mainMsg", "تم تحميل المستخدمين");
    }

    async function addUser() {
      const name = document.getElementById("newName").value.trim();
      const phone = document.getElementById("newPhone").value.trim();
      const password = document.getElementById("newPassword").value.trim();

      const res = await fetch("/api/users", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          admin: admin(),
          name,
          phone,
          password
        })
      });

      const data = await res.json();
      show("addMsg", data.message || "تم");

      if (data.ok) {
        document.getElementById("newName").value = "";
        document.getElementById("newPhone").value = "";
        document.getElementById("newPassword").value = "";
        loadUsers();
      }
    }

    async function deleteUser(encodedName) {
      if (!confirm("هل تريد حذف هذا المستخدم؟")) return;

      const res = await fetch("/api/users/" + encodedName + "?admin=" + encodeURIComponent(admin()), {
        method: "DELETE"
      });

      const data = await res.json();
      show("mainMsg", data.message || "تم");

      if (data.ok) {
        loadUsers();
      }
    }
  </script>
</body>
</html>
