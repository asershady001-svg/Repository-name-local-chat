<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Local Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00a884">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b141a;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .topbar {
      height: 68px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 1px solid #111b21;
    }

    .back {
      display: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #8696a0;
      margin-top: 4px;
    }
    .aiTopBtn {
      border: none;
      border-radius: 999px;
      background: #00a884;
      color: white;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .aiTopBtn:hover {
      background: #06cf9c;
    }


    .nameScreen {
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #202c33;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .card p {
      margin: 0 0 22px;
      color: #aebac1;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a3942;
      background: #111b21;
      color: white;
      outline: none;
      font-size: 17px;
      text-align: right;
    }

    .mainBtn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #00a884;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .chatList {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #111b21;
    }

    .searchBox {
      padding: 12px;
      background: #111b21;
    }

    .searchBox input {
      background: #202c33;
      border: none;
      border-radius: 20px;
      padding: 13px 16px;
      font-size: 15px;
    }

    .chatItem {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-bottom: 1px solid #202c33;
      cursor: pointer;
      background: #111b21;
    }

    .chatItem:hover {
      background: #182229;
    }

    .chatItem .avatar {
      width: 50px;
      height: 50px;
    }

    .chatText {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .lastMsg {
      color: #8696a0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chatTime {
      color: #8696a0;
      font-size: 12px;
    }

    .chatMeta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 42px;
    }

    .unreadBadge {
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #00a884;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chatItem.unread {
      background: #14242b;
    }

    .chatItem.unread .chatName {
      color: #ffffff;
    }

    .chatItem.unread .lastMsg {
      color: #d9fdd3;
      font-weight: bold;
    }

    .chatScreen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .callPanel {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:#111b21;
  border-bottom:1px solid #22303a;
  overflow-x:auto;
}

.callPanel button {
  border:none;
  border-radius:18px;
  padding:10px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#00a884;
  white-space:nowrap;
}

.callPanel .endCallBtn {
  background:#ff3b30;
}

#callStatus {
  color:#d1f7c4;
  font-size:15px;
  font-weight:bold;
}

    .callPanel button {
      border: none;
      border-radius: 18px;
      padding: 8px 12px;
      background: #00a884;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .callPanel .endCallBtn {
      background: #d93025;
    }

    #callStatus {
      color: #d9fdd3;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      background: #0b141a;
    }

    .row {
      display: flex;
      margin-bottom: 9px;
      width: 100%;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.other {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 11px;
      line-height: 1.45;
      font-size: 16px;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .me .bubble {
      background: #005c4b;
      border-top-right-radius: 2px;
    }

    .other .bubble {
      background: #202c33;
      border-top-left-radius: 2px;
    }

    .sender {
      color: #00a884;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .time {
      color: #aebac1;
      font-size: 11px;
      text-align: left;
      margin-top: 4px;
    }

    .chatImage {
      max-width: 230px;
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-top: 5px;
      cursor: pointer;
    }

    .system {
      text-align: center;
      color: #8696a0;
      font-size: 13px;
      margin: 10px 0;
    }

    #typing {
      height: 22px;
      padding: 2px 16px;
      font-size: 13px;
      color: #00a884;
      background: #0b141a;
    }

    .sendbar {
      background: #202c33;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sendbar input[type="text"] {
      flex: 1;
      border: none;
      border-radius: 24px;
      background: #2a3942;
      padding: 14px 16px;
      font-size: 16px;
    }

    .sendbar button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .imageBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn.recording {
      background: #d93025 !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .audioMessage {
      width: 230px;
      max-width: 100%;
      margin-top: 6px;
    }

    #imageInput {
      display: none;
    }

    .imageViewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .imageViewer img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
    }

    .closeViewer {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #202c33;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 24px;
      cursor: pointer;
    }

    @media (min-width: 800px) {
      body {
        background: #0a1014;
        display: flex;
        justify-content: center;
      }

      .app {
        max-width: 520px;
        width: 100%;
        border-left: 1px solid #2a3942;
        border-right: 1px solid #2a3942;
      }
    }
    .deleteBtn {
    background: #2a3942;
    color: #ff6b6b;
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
  }

  .deleteBtn:hover {
    background: #3b4a54;
  }
  
    .videoCallBox {
      display: none;
      gap: 8px;
      padding: 8px;
      background: #0b141a;
      border-bottom: 1px solid #2a3942;
    }

    .videoCallBox video {
      width: 48%;
      max-height: 180px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }
      .incomingCallOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .incomingCallCard {
      width: min(360px, 100%);
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      text-align: center;
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    .incomingCallIcon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 34px;
    }

    .incomingCallTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111827;
    }

    .incomingCallText {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .incomingCallActions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .incomingCallActions button {
      border: 0;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      min-width: 110px;
    }

    .acceptIncomingCallBtn {
      background: #16a34a;
      color: white;
    }

    .rejectIncomingCallBtn {
      background: #dc2626;
      color: white;
    }
      .languageToggleBox {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 99998;
    }

    .languageToggleBtn {
      border: 0;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .languageToggleBtn:hover {
      background: #2563eb;
    }
      .worldLanguageBox {
      position: fixed;
      top: 58px;
      left: 14px;
      z-index: 99998;
      background: rgba(255,255,255,0.96);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.16);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .worldLanguageBox select {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      max-width: 190px;
      background: white;
    }

    .worldLanguageBox button {
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .worldLanguageBox button:hover {
      background: #1d4ed8;
    }
      /* Clean unified language menu */
    .languageToggleBox {
      position: fixed !important;
      top: 14px !important;
      left: 14px !important;
      z-index: 100000 !important;
    }

    .languageToggleBtn {
      border: 0 !important;
      border-radius: 999px !important;
      background: #111827 !important;
      color: #ffffff !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18) !important;
    }

    .worldLanguageBox {
      position: fixed !important;
      top: 58px !important;
      left: 14px !important;
      z-index: 99999 !important;
      background: rgba(255,255,255,0.98) !important;
      border-radius: 16px !important;
      padding: 10px !important;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18) !important;
      display: none;
      gap: 7px !important;
      align-items: center !important;
      max-width: calc(100vw - 28px) !important;
    }

    .worldLanguageBox.open {
      display: flex !important;
    }
  
    .refreshPageBtn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #2a3942;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .refreshPageBtn:hover {
      background: #00a884;
    }
</style>

  background:#111b21 !important;

          name: otherName + " خاص",
          peerName: otherName,
          avatar: "👤",

      const merged = fromUsers.slice();

            chat.name = chat.name + " خاص";

          merged.push(chat);
        }

      chatsList = merged;
      refreshChatList();

    function generateAIReply(question) {
      const q = String(question || "").toLowerCase();

      if (q.includes("مرحبا") || q.includes("هلا") || q.includes("السلام") || q.includes("ازيك") || q.includes("كيف حالك")) {
        return "أهلًا يا صديقي، أنا مساعدك الشخصي داخل Local Chat. اكتب لي السؤال أو المسألة، وسأحاول مساعدتك فورًا.";
      }

      if (q.includes("كيمياء") || q.includes("اتزان") || q.includes("مول") || q.includes("ph") || q.includes("حمض") || q.includes("قاعدة") || q.includes("حرارة")) {
        return "تمام، هذه مسألة كيمياء. اكتب المعطيات كاملة والمطلوب، وسأرتب لك الحل بهذا الشكل: القانون، التعويض، الناتج، والوحدة. إذا كانت مسألة اتزان سأستخدم جدول ICE.";
      }

      if (q.includes("رياض") || q.includes("احسب") || q.includes("معادلة") || q.includes("مساحة") || q.includes("نسبة") || q.includes("جبر")) {
        return "تمام، هذه مسألة رياضيات. اكتب المسألة كاملة بالأرقام، وسأحلها لك خطوة خطوة بطريقة بسيطة.";
      }

      if (q.includes("فيزياء") || q.includes("سرعة") || q.includes("قوة") || q.includes("طاقة") || q.includes("زمن")) {
        return "تمام، هذه مسألة فيزياء. اكتب المعطيات والمطلوب، وسأحدد القانون المناسب ثم أعوض وأكتب الناتج بالوحدة.";
      }

      if (q.includes("ترجم") || q.includes("english") || q.includes("انجليزي") || q.includes("translate")) {
        return "أرسل الجملة أو الفقرة التي تريد ترجمتها، وسأساعدك في ترجمتها أو تصحيحها.";
      }

      return "أنا أعمل الآن بوضع محلي تجريبي. أستطيع مساعدتك أكثر إذا كتبت نوع السؤال بوضوح مثل: كيمياء، رياضيات، فيزياء، ترجمة. وللرد مثل ChatGPT الحقيقي نحتاج تفعيل OPENAI_API_KEY الحقيقي لاحقًا.";
    }

    async function handleAIAssistantMessage(text) {
      const userMessage = {
        type: "text",
        name: username,
        text: text,
        time: nowTime()
      };

      addLocalMessageToRoom("ai-assistant", userMessage);

      const thinkingMessage = {
        type: "text",
        name: "AI Assistant",
        text: "جار التفكير...",
        time: nowTime()
      };

      addLocalMessageToRoom("ai-assistant", thinkingMessage);

      try {
        const response = await fetch("/api/ai-chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        thinkingMessage.text = (data && data.ok && data.reply) ? data.reply : generateAIReply(text);
        thinkingMessage.time = nowTime();

        renderRoomMessages("ai-assistant");
        refreshChatList();
      } catch (error) {
        thinkingMessage.text = generateAIReply(text);
        thinkingMessage.time = nowTime();

        renderRoomMessages("ai-assistant");
        refreshChatList();
      }
    }
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !currentRoom) return;

      if (currentRoom === "ai-assistant") {
        handleAIAssistantMessage(text);
        input.value = "";
        return;
      }

      socket.emit("chat message", {
        type: "text",
        name: username,
        text: text,
        time: nowTime()
      });

      socket.emit("stop typing");
      input.value = "";
    }

    async function toggleRecording() {
      if (!currentRoom) {
        alert("Open a chat first");
        return;
      }

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = function() {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            pendingVoiceBlob = audioBlob;

            if (audioBlob.size > 3 * 1024 * 1024) {
              alert("Voice recording is too long. Try a shorter recording.");
              stream.getTracks().forEach(track => track.stop());
              return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
              showVoicePreview(e.target.result);
            };

            reader.readAsDataURL(audioBlob);

            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;

          const btn = document.getElementById("voiceBtn");
          if (btn) btn.innerText = "â¹";

        } catch (error) {
          alert("Microphone permission was not allowed");
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }

        isRecording = false;

        const btn = document.getElementById("voiceBtn");
        if (btn) btn.innerText = "ðŸŽ¤";
      }
    }

    let pendingIncomingCallData = null;

    function startIncomingRingtone() {
      stopIncomingRingtone();

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        incomingRingAudioContext = new AudioContextClass();

        const ringOnce = function() {
          if (!incomingRingAudioContext) return;

          const osc = incomingRingAudioContext.createOscillator();
          const gain = incomingRingAudioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(880, incomingRingAudioContext.currentTime);

          gain.gain.setValueAtTime(0.0001, incomingRingAudioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.22, incomingRingAudioContext.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, incomingRingAudioContext.currentTime + 0.55);

          osc.connect(gain);
          gain.connect(incomingRingAudioContext.destination);

          osc.start();
          osc.stop(incomingRingAudioContext.currentTime + 0.6);
        };

        ringOnce();
        incomingRingInterval = setInterval(ringOnce, 1200);
      } catch (error) {
        console.log("Ringtone blocked or failed:", error);
      }
    }

    function stopIncomingRingtone() {
      if (incomingRingInterval) {
        clearInterval(incomingRingInterval);
        incomingRingInterval = null;
      }

      if (incomingRingAudioContext) {
        incomingRingAudioContext.close().catch(() => {});
        incomingRingAudioContext = null;
      }
    }

<script id="DELETE_SELECTED_PATCH_V1">
(function () {
  if (window.DELETE_SELECTED_PATCH_V1) return;
  window.DELETE_SELECTED_PATCH_V1 = true;

  function ensureMessageIds() {
    if (!currentRoom || !messagesByRoom[currentRoom]) return;

    messagesByRoom[currentRoom].forEach(function(message, index) {
      if (!message.id) {
        message.id = Date.now().toString(36) + "-" + index + "-" + Math.random().toString(36).slice(2, 8);
      }
    });
  }

  function ensureDeleteSelectedButton() {
    const bar = document.querySelector(".sendbar");
    const input = document.getElementById("messageInput");

    if (!bar || !input || document.getElementById("deleteSelectedMessagesBtn")) return;

    const btn = document.createElement("button");
    btn.id = "deleteSelectedMessagesBtn";
    btn.type = "button";
    btn.textContent = "ðŸ—‘âœ“";
    btn.title = "Delete selected messages";
    btn.onclick = window.deleteSelectedMessages;
    btn.style.minWidth = "44px";

    bar.insertBefore(btn, input);
  }

  function ensureMessageCheckboxes() {
    if (!currentRoom || !messagesByRoom[currentRoom]) return;

    ensureMessageIds();

    const rows = document.querySelectorAll("#messages .row");
    const list = messagesByRoom[currentRoom];

    rows.forEach(function(row, index) {
      const message = list[index];
      if (!message) return;

      row.dataset.messageId = message.id;

      if (row.querySelector(".messageSelect")) return;

      const label = document.createElement("label");
      label.style.display = "block";
      label.style.fontSize = "12px";
      label.style.opacity = "0.8";
      label.style.marginBottom = "4px";
      label.style.cursor = "pointer";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "messageSelect";
      checkbox.value = message.id;
      checkbox.style.marginRight = "5px";

      const span = document.createElement("span");
      span.textContent = "Select";

      label.appendChild(checkbox);
      label.appendChild(span);

      const bubble = row.querySelector(".bubble") || row;
      bubble.insertBefore(label, bubble.firstChild);
    });
  }

  window.deleteSelectedMessages = function () {
    if (!currentRoom) return;

    const checked = Array.from(document.querySelectorAll(".messageSelect:checked"));
    const ids = checked.map(function(box) { return box.value; }).filter(Boolean);

    if (!ids.length) {
      alert("Select one or more messages first");
      return;
    }

    const ok = confirm("Delete selected messages only?");
    if (!ok) return;

    socket.emit("delete selected messages", {
      room: currentRoom,
      ids: ids
    });
  };

  function installSocketDeleteListener() {
    if (typeof socket === "undefined" || !socket || socket.__deleteSelectedPatch) return;

    socket.__deleteSelectedPatch = true;

    socket.on("selected messages deleted", function(data) {
      if (!data || !data.room || !Array.isArray(data.ids)) return;

      if (!messagesByRoom[data.room]) {
        messagesByRoom[data.room] = [];
      }

      messagesByRoom[data.room] = messagesByRoom[data.room].filter(function(message) {
        return !data.ids.includes(String(message.id || ""));
      });

      if (data.room === currentRoom) {
        renderRoomMessages(currentRoom);
        setTimeout(ensureMessageCheckboxes, 100);
      }
    });
  }

  ensureDeleteSelectedButton();
  installSocketDeleteListener();

  setInterval(ensureDeleteSelectedButton, 1000);
  setInterval(ensureMessageCheckboxes, 1000);
  setInterval(installSocketDeleteListener, 1000);
})();
</script>

<script id="VOICE_STYLE_PATCH_JS_V1">
(function () {
  if (window.VOICE_STYLE_PATCH_V1) return;
  window.VOICE_STYLE_PATCH_V1 = true;

  function formatVoiceTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function buildBars() {
    const heights = [10,18,24,14,28,20,12,26,16,30,22,13,25,19,12,27,17,23,11,21,29,18,14,26,20,12,24,16];
    return heights.map(function(h) {
      return '<span class="voiceBar" style="height:' + h + 'px"></span>';
    }).join("");
  }

  function enhanceAudioMessages() {
    document.querySelectorAll("audio.audioMessage").forEach(function(audio) {
      if (audio.dataset.voiceStyled === "1") return;
      audio.dataset.voiceStyled = "1";

      const src = audio.getAttribute("src");
      if (!src) return;

      const box = document.createElement("div");
      box.className = "voiceUiBox";
      box.innerHTML =
        '<button type="button" class="voicePlayBtn">â–¶</button>' +
        '<div class="voiceWave">' + buildBars() + '</div>' +
        '<span class="voiceTime">0:00</span>' +
        '<button type="button" class="voiceSpeedBtn">1x</button>';

      const playBtn = box.querySelector(".voicePlayBtn");
      const wave = box.querySelector(".voiceWave");
      const time = box.querySelector(".voiceTime");
      const speedBtn = box.querySelector(".voiceSpeedBtn");
      const bars = Array.from(box.querySelectorAll(".voiceBar"));

      audio.controls = false;
      audio.style.display = "none";

      audio.addEventListener("loadedmetadata", function () {
        time.textContent = formatVoiceTime(audio.duration || 0);
      });

      audio.addEventListener("timeupdate", function () {
        const duration = audio.duration || 0;
        const current = audio.currentTime || 0;
        const percent = duration ? current / duration : 0;
        const activeCount = Math.floor(percent * bars.length);

        bars.forEach(function(bar, i) {
          if (i <= activeCount) bar.classList.add("active");
          else bar.classList.remove("active");
        });

        time.textContent = formatVoiceTime(duration ? (duration - current) : current);
      });

      audio.addEventListener("ended", function () {
        playBtn.textContent = "â–¶";
        bars.forEach(function(bar) { bar.classList.remove("active"); });
        time.textContent = formatVoiceTime(audio.duration || 0);
      });

      playBtn.onclick = function () {
        document.querySelectorAll("audio.audioMessage").forEach(function(otherAudio) {
          if (otherAudio !== audio) {
            otherAudio.pause();
          }
        });

        if (audio.paused) {
          audio.play();
          playBtn.textContent = "â…¡";
        } else {
          audio.pause();
          playBtn.textContent = "â–¶";
        }
      };

      wave.onclick = function (event) {
        const rect = wave.getBoundingClientRect();
        const percent = (event.clientX - rect.left) / rect.width;
        if (audio.duration) {
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.duration * percent));
        }
      };

      speedBtn.onclick = function () {
        const speeds = [1, 1.5, 2];
        const current = audio.playbackRate || 1;
        const next = speeds[(speeds.indexOf(current) + 1) % speeds.length] || 1;
        audio.playbackRate = next;
        speedBtn.textContent = next + "x";
      };

      audio.parentNode.insertBefore(box, audio);
      box.appendChild(audio);
    });
  }

  enhanceAudioMessages();
  setInterval(enhanceAudioMessages, 700);
})();
</script>

  const menu = document.getElementById("attachMenu");
  if (!menu) return;
  if (force === false) menu.classList.remove("open");
  else menu.classList.toggle("open");
}

function sendFile(event){
  const file = event.target.files[0];
  if (!file || !currentRoom) return;

  if (file.size > 5 * 1024 * 1024) {
    alert("File is too large. Choose a file under 5 MB.");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    socket.emit("chat message", {
      type: "file",
      name: username,
      text: file.name,
      fileName: file.name,
      fileType: file.type || "file",
      fileData: e.target.result,
      time: nowTime()
    });
    event.target.value = "";
  };
  reader.readAsDataURL(file);
}
</script>

<script id="SAFE_CHAT_TEXT_FIX">
(function(){

  function bad(t){
    return /Ã|Â|Å|™|Ø|ð|â|�/.test(t || "");
  }

  function cleanChats(){

    document.querySelectorAll(".chatItem,.chatRow,.chat").forEach(function(chat){

      const spans = chat.querySelectorAll("div,span,p");

      spans.forEach(function(el){

        const txt = (el.textContent || "").trim();

        if (!txt) return;

        if (bad(txt)){

          if (txt.length < 18){
            el.textContent = "User";
          }else{
            el.textContent = "Message";
          }

        }

      });

    });

  }

  cleanChats();

  window.addEventListener("load", cleanChats);

  setInterval(cleanChats, 1200);

})();
</script>
