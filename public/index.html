<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Local Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00a884">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b141a;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .topbar {
      height: 68px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 1px solid #111b21;
    }

    .back {
      display: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #8696a0;
      margin-top: 4px;
    }

    .nameScreen {
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #202c33;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .card p {
      margin: 0 0 22px;
      color: #aebac1;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a3942;
      background: #111b21;
      color: white;
      outline: none;
      font-size: 17px;
      text-align: right;
    }

    .mainBtn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #00a884;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .chatList {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #111b21;
    }

    .searchBox {
      padding: 12px;
      background: #111b21;
    }

    .searchBox input {
      background: #202c33;
      border: none;
      border-radius: 20px;
      padding: 13px 16px;
      font-size: 15px;
    }

    .chatItem {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-bottom: 1px solid #202c33;
      cursor: pointer;
      background: #111b21;
    }

    .chatItem:hover {
      background: #182229;
    }

    .chatItem .avatar {
      width: 50px;
      height: 50px;
    }

    .chatText {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .lastMsg {
      color: #8696a0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chatTime {
      color: #8696a0;
      font-size: 12px;
    }

    .chatMeta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 42px;
    }

    .unreadBadge {
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #00a884;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chatItem.unread {
      background: #14242b;
    }

    .chatItem.unread .chatName {
      color: #ffffff;
    }

    .chatItem.unread .lastMsg {
      color: #d9fdd3;
      font-weight: bold;
    }

    .chatScreen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .callPanel {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #111b21;
      border-bottom: 1px solid #2a3942;
    }

    .callPanel button {
      border: none;
      border-radius: 18px;
      padding: 8px 12px;
      background: #00a884;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .callPanel .endCallBtn {
      background: #d93025;
    }

    #callStatus {
      color: #d9fdd3;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      background: #0b141a;
    }

    .row {
      display: flex;
      margin-bottom: 9px;
      width: 100%;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.other {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 11px;
      line-height: 1.45;
      font-size: 16px;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .me .bubble {
      background: #005c4b;
      border-top-right-radius: 2px;
    }

    .other .bubble {
      background: #202c33;
      border-top-left-radius: 2px;
    }

    .sender {
      color: #00a884;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .time {
      color: #aebac1;
      font-size: 11px;
      text-align: left;
      margin-top: 4px;
    }

    .chatImage {
      max-width: 230px;
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-top: 5px;
      cursor: pointer;
    }

    .system {
      text-align: center;
      color: #8696a0;
      font-size: 13px;
      margin: 10px 0;
    }

    #typing {
      height: 22px;
      padding: 2px 16px;
      font-size: 13px;
      color: #00a884;
      background: #0b141a;
    }

    .sendbar {
      background: #202c33;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sendbar input[type="text"] {
      flex: 1;
      border: none;
      border-radius: 24px;
      background: #2a3942;
      padding: 14px 16px;
      font-size: 16px;
    }

    .sendbar button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .imageBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn.recording {
      background: #d93025 !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .audioMessage {
      width: 230px;
      max-width: 100%;
      margin-top: 6px;
    }

    #imageInput {
      display: none;
    }

    .imageViewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .imageViewer img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
    }

    .closeViewer {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #202c33;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 24px;
      cursor: pointer;
    }

    @media (min-width: 800px) {
      body {
        background: #0a1014;
        display: flex;
        justify-content: center;
      }

      .app {
        max-width: 520px;
        width: 100%;
        border-left: 1px solid #2a3942;
        border-right: 1px solid #2a3942;
      }
    }
    .deleteBtn {
    background: #2a3942;
    color: #ff6b6b;
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
  }

  .deleteBtn:hover {
    background: #3b4a54;
  }
  
    .videoCallBox {
      display: none;
      gap: 8px;
      padding: 8px;
      background: #0b141a;
      border-bottom: 1px solid #2a3942;
    }

    .videoCallBox video {
      width: 48%;
      max-height: 180px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }
      .incomingCallOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .incomingCallCard {
      width: min(360px, 100%);
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      text-align: center;
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    .incomingCallIcon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 34px;
    }

    .incomingCallTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111827;
    }

    .incomingCallText {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .incomingCallActions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .incomingCallActions button {
      border: 0;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      min-width: 110px;
    }

    .acceptIncomingCallBtn {
      background: #16a34a;
      color: white;
    }

    .rejectIncomingCallBtn {
      background: #dc2626;
      color: white;
    }
      .languageToggleBox {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 99998;
    }

    .languageToggleBtn {
      border: 0;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .languageToggleBtn:hover {
      background: #2563eb;
    }
      .worldLanguageBox {
      position: fixed;
      top: 58px;
      left: 14px;
      z-index: 99998;
      background: rgba(255,255,255,0.96);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.16);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .worldLanguageBox select {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      max-width: 190px;
      background: white;
    }

    .worldLanguageBox button {
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .worldLanguageBox button:hover {
      background: #1d4ed8;
    }
      /* Clean unified language menu */
    .languageToggleBox {
      position: fixed !important;
      top: 14px !important;
      left: 14px !important;
      z-index: 100000 !important;
    }

    .languageToggleBtn {
      border: 0 !important;
      border-radius: 999px !important;
      background: #111827 !important;
      color: #ffffff !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18) !important;
    }

    .worldLanguageBox {
      position: fixed !important;
      top: 58px !important;
      left: 14px !important;
      z-index: 99999 !important;
      background: rgba(255,255,255,0.98) !important;
      border-radius: 16px !important;
      padding: 10px !important;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18) !important;
      display: none;
      gap: 7px !important;
      align-items: center !important;
      max-width: calc(100vw - 28px) !important;
    }

    .worldLanguageBox.open {
      display: flex !important;
    }
  
    .refreshPageBtn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #2a3942;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .refreshPageBtn:hover {
      background: #00a884;
    }
</style>

<body>
  <div class="incomingCallOverlay" id="incomingCallOverlay">
    <div class="incomingCallCard">
      <div class="incomingCallIcon" id="incomingCallIcon">📞</div>
      <div class="incomingCallTitle" id="incomingCallTitle">مكالمة واردة</div>
      <div class="incomingCallText" id="incomingCallText">لديك مكالمة واردة</div>
      <div class="incomingCallActions">
        <button class="acceptIncomingCallBtn" onclick="acceptIncomingCallPopup()">قبول</button>
        <button class="rejectIncomingCallBtn" onclick="rejectIncomingCallPopup()">رفض</button>
      </div>
    </div>
  </div>

  <div class="languageToggleBox">
    <button class="languageToggleBtn" id="languageToggleBtn" onclick="toggleLanguageMenu()">🌐 Language</button>
  </div>

  <div class="worldLanguageBox" id="worldLanguageBox">
    <select id="worldLanguageSelect" title="Choose language">

      <option value="cs">Čeština</option>

      <option value="no">Norsk</option>
      <option value="da">Dansk</option>
      <option value="fi">Suomi</option>
    </select>
    <button onclick="translateCurrentPage()">ترجمة</button>
  </div>

  <div class="app">
    <div class="topbar">
      <button class="back" id="backBtn" onclick="backToList()">‹</button>
      <button class="refreshPageBtn" id="refreshPageBtn" onclick="refreshApp()" title="Refresh">&#x1F504;</button>
      <div class="avatar" id="topAvatar">LC</div>
      <div class="info">
        <div class="title" id="topTitle">Local Chat</div>
        <div class="subtitle" id="topSubtitle">جاهز للاتصال - Version: login-fix-private-chat</div>
      </div>
    </div>

    <div class="nameScreen" id="nameScreen">
      <div class="card">
        <h2>مرحبًا بك في Local Chat</h2>
        <p>اكتب اسم المستخدم ورقم الهاتف فقط للدخول إلى المحادثات</p>
                <input id="nameInput" placeholder="اسم المستخدم" />
        <input id="phoneInput" placeholder="رقم الهاتف" inputmode="tel" style="margin-top: 10px;" />
        
        <button class="mainBtn" onclick="saveName()">متابعة</button>
      </div>
    </div>

    <div class="chatList" id="chatList">
      <div class="searchBox">
        <input placeholder="بحث في المحادثات..." oninput="filterChats(this.value)" />
      </div>

      <div id="chatItemsBox"></div>
    </div>

    <div class="chatScreen" id="chatScreen">
      <div class="callPanel" id="callPanel">
        <button onclick="startVoiceCall()">📞 مكالمة صوتية</button>
        <button onclick="startVideoCall()">📹 Video Call</button>
        <button class="endCallBtn" onclick="endCall()">إنهاء</button>
        <span id="callStatus">جاهز للمكالمة</span>
        <audio id="remoteCallAudio" autoplay></audio>
      </div>
      <div class="videoCallBox" id="videoCallBox">
        <video id="localCallVideo" autoplay muted playsinline></video>
        <video id="remoteCallVideo" autoplay playsinline></video>
      </div>
      <div id="messages"></div>
      <div id="typing"></div>

      <div class="sendbar">
        <button class="imageBtn" onclick="document.getElementById('imageInput').click()">📷</button>
        <input id="imageInput" type="file" accept="image/*" onchange="sendImage(event)" />
        <button class="deleteBtn" title="مسح رسائل هذه المحادثة" onclick="clearCurrentRoomMessages()">🗑️</button>
        <button class="voiceBtn" id="voiceBtn" onclick="toggleRecording()">🎤</button>
        <input id="messageInput" type="text" placeholder="اكتب رسالة..." oninput="sendTyping()" onkeydown="handleEnter(event)" />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <div class="imageViewer" id="imageViewer" onclick="closeImageViewer()">
    <button class="closeViewer">×</button>
    <img id="viewerImage" />
  </div>

  <script>
    const socket = io();

    let username = "";
    let currentRoom = "";

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const messagesByRoom = {};
    const unreadCounts = {};
    let chatsList = [];
    let onlinePrivateChats = [];

    function makePrivateRoomId(firstName, secondName) {
      return "private:" + [firstName, secondName].sort().join("__");
    }

    function refreshChatList() {
      renderChats(onlinePrivateChats.concat(chatsList));
    }

    async function loadChats() {
      const res = await fetch("/api/chats-public");
      const data = await res.json();

      if (!data.ok) return;

      chatsList = data.chats || [];
      refreshChatList();
    }

    function renderChats(list) {
      const box = document.getElementById("chatItemsBox");
      box.innerHTML = "";

      list.forEach(chat => {
        if (!messagesByRoom[chat.id]) {
          messagesByRoom[chat.id] = [];
        }

        const div = document.createElement("div");
        const unread = unreadCounts[chat.id] || 0;
        const latest = messagesByRoom[chat.id] && messagesByRoom[chat.id].length
          ? messagesByRoom[chat.id][messagesByRoom[chat.id].length - 1]
          : null;
        const latestText = latest
          ? latest.name + ": " + (latest.type === "image" ? "📷 صورة" : latest.type === "audio" ? "🎤 رسالة صوتية" : latest.text)
          : "اضغط للدخول إلى المحادثة";

        div.className = "chatItem" + (unread > 0 ? " unread" : "");
        div.setAttribute("data-name", chat.name);

        div.innerHTML = `
          <div class="avatar">${chat.avatar || "د"}</div>
          <div class="chatText">
            <div class="chatName">${chat.name}</div>
            <div class="lastMsg" id="last-${chat.id}">${latestText}</div>
          </div>
          <div class="chatMeta">
            <div class="chatTime">الآن</div>
            <div class="unreadBadge" id="unread-${chat.id}" style="${unread > 0 ? "" : "display:none"}">${unread}</div>
          </div>
        `;

        div.onclick = function() {
          openRoom(chat.id, chat.name, chat.avatar || "د");
        };

        box.appendChild(div);
      });
    }

    function refreshApp() {
      window.location.reload();
    }

    function saveName() {
      const inputName = document.getElementById("nameInput").value.trim();
      const inputPhone = document.getElementById("phoneInput").value.trim();

      if (!inputName) {
        alert("اكتب اسم المستخدم");
        return;
      }

      if (!inputPhone) {
        alert("اكتب رقم الهاتف");
        return;
      }

      socket.emit("login", {
        name: inputName,
        phone: inputPhone
      }, function(response) {
        if (!response || !response.ok) {
          alert(response && response.message ? response.message : "فشل تسجيل الدخول");
          return;
        }

        username = response.name;

        document.getElementById("nameScreen").style.display = "none";
        document.getElementById("chatList").style.display = "block";
        document.getElementById("topTitle").innerText = "المحادثات";
        document.getElementById("topSubtitle").innerText = username + " متصل";

        loadChats();

        setTimeout(function() {
          socket.emit("request online users");
        }, 500);
      });
    }
    function openRoom(room, roomName, avatar) {
      currentRoom = room;
      unreadCounts[room] = 0;
      refreshChatList();

      document.getElementById("chatList").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";
      document.getElementById("callPanel").style.display = "flex";
      document.getElementById("backBtn").style.display = "block";
      document.getElementById("topAvatar").innerText = avatar;
      document.getElementById("topTitle").innerText = roomName;
      document.getElementById("topSubtitle").innerText = "متصل الآن";
      document.getElementById("messages").innerHTML = "";

      socket.emit("join room", {
        room: room,
        name: username
      });

      setTimeout(() => {
        document.getElementById("messageInput").focus();
      }, 200);
    }

    function backToList() {
      currentRoom = "";
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("callPanel").style.display = "none";
      document.getElementById("chatList").style.display = "block";
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("topAvatar").innerText = "LC";
      document.getElementById("topTitle").innerText = "المحادثات";
      document.getElementById("topSubtitle").innerText = username + " متصل";
      document.getElementById("typing").innerText = "";
    }

    function nowTime() {
      const d = new Date();
      return d.toLocaleTimeString("ar-QA", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !currentRoom) return;

      socket.emit("chat message", {
        type: "text",
        name: username,
        text: text,
        time: nowTime()
      });

      socket.emit("stop typing");
      input.value = "";
    }

    function sendImage(event) {
      const file = event.target.files[0];

      if (!file || !currentRoom) return;

      if (!file.type.startsWith("image/")) {
        alert("اختر صورة فقط");
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        alert("الصورة كبيرة جدا. اختر صورة أقل من 2 ميجا.");
        event.target.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        socket.emit("chat message", {
          type: "image",
          name: username,
          text: "صورة",
          image: e.target.result,
          time: nowTime()
        });

        event.target.value = "";
      };

      reader.readAsDataURL(file);
    }


    async function toggleRecording() {
      if (!currentRoom) {
        alert("ادخل محادثة أولًا");
        return;
      }

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = function() {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });

            if (audioBlob.size > 3 * 1024 * 1024) {
              alert("التسجيل طويل جدًا. حاول تسجيل مدة أقصر.");
              return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
              socket.emit("chat message", {
                type: "audio",
                name: username,
                text: "رسالة صوتية",
                audio: e.target.result,
                time: nowTime()
              });
            };

            reader.readAsDataURL(audioBlob);

            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;

          const btn = document.getElementById("voiceBtn");
          btn.innerText = "■";
          btn.classList.add("recording");

        } catch (error) {
          alert("لم يتم السماح باستخدام الميكروفون");
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }

        isRecording = false;

        const btn = document.getElementById("voiceBtn");
        btn.innerText = "🎤";
        btn.classList.remove("recording");
      }
    }

    let callPeerConnection = null;
    let localCallStream = null;
    let isInCall = false;

    let callRtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:stun3.l.google.com:19302" },
        { urls: "stun:stun4.l.google.com:19302" }
      ]
    };

    async function loadIceConfig() {
      try {
        const response = await fetch("/ice-config", { cache: "no-store" });
        const data = await response.json();

        if (data && data.ok && Array.isArray(data.iceServers) && data.iceServers.length > 0) {
          callRtcConfig = { iceServers: data.iceServers };
          console.log("ICE config loaded. TURN enabled:", !!data.turnEnabled);
        }
      } catch (error) {
        console.log("Using fallback STUN config:", error);
      }
    }

    function isPrivateRoom() {
      return currentRoom && currentRoom.indexOf("private:") === 0;
    }

    function setCallStatus(text) {
      const el = document.getElementById("callStatus");
      if (el) el.innerText = text;
    }

    async function prepareLocalAudio() {
      if (localCallStream) return localCallStream;

      localCallStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

      return localCallStream;
    }

    async function prepareLocalVideo() {
      if (localCallStream) return localCallStream;

      localCallStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: true
      });

      const localVideo = document.getElementById("localCallVideo");
      if (localVideo) {
        localVideo.srcObject = localCallStream;
        localVideo.play().catch(() => {});
      }

      const videoBox = document.getElementById("videoCallBox");
      if (videoBox) {
        videoBox.style.display = "flex";
      }

      return localCallStream;
    }

    function createCallPeerConnection() {
      callPeerConnection = new RTCPeerConnection(callRtcConfig);

      callPeerConnection.onicecandidate = function(event) {
        if (event.candidate) {
          socket.emit("call-ice-candidate", {
            candidate: event.candidate
          });
        }
      };

      callPeerConnection.ontrack = function(event) {
        const stream = event.streams[0];
        const hasVideo = stream && stream.getVideoTracks && stream.getVideoTracks().length > 0;

        if (hasVideo) {
          const remoteVideo = document.getElementById("remoteCallVideo");
          const videoBox = document.getElementById("videoCallBox");

          if (videoBox) {
            videoBox.style.display = "flex";
          }

          if (remoteVideo) {
            remoteVideo.srcObject = stream;
            remoteVideo.play().catch(() => {});
          }
        } else {
          const audio = document.getElementById("remoteCallAudio");
          if (audio) {
            audio.srcObject = stream;
            audio.play().catch(() => {});
          }
        }
      };

      return callPeerConnection;
    }

    async function startVoiceCall() {
      if (!currentRoom) {
        alert("ادخل محادثة أولًا");
        return;
      }

      if (isInCall) {
        alert("هناك مكالمة تعمل بالفعل");
        return;
      }

      try {
        setCallStatus("جاري بدء المكالمة...");
        await loadIceConfig();
        const stream = await prepareLocalAudio();
        const pc = createCallPeerConnection();

        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        isInCall = true;

        socket.emit("call-offer", {
          type: "voice",
          offer
        });

        setCallStatus("جاري الاتصال...");
      } catch (error) {
        console.log(error);
        setCallStatus("فشل تشغيل الميكروفون");
        alert("لم يتم تشغيل الميكروفون. على الهاتف قد تحتاج HTTPS لتعمل المكالمات.");
        endCall(false);
      }
    }

    async function startVideoCall() {
      if (!currentRoom) {
        alert("ادخل محادثة أولًا");
        return;
      }

      if (isInCall) {
        alert("هناك مكالمة تعمل بالفعل");
        return;
      }

      try {
        setCallStatus("Starting video call...");
        await loadIceConfig();
        const stream = await prepareLocalVideo();
        const pc = createCallPeerConnection();

        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        isInCall = true;

        socket.emit("call-offer", {
          type: "video",
          offer
        });

        setCallStatus("Calling with video...");
      } catch (error) {
        console.log(error);
        setCallStatus("Camera failed");
        alert("Camera or microphone could not start. On phone, video calls may need HTTPS.");
        endCall(false);
      }
    }

    async function acceptVideoCall(data) {
      try {
        setCallStatus("Video call accepted...");
        await loadIceConfig();
        const stream = await prepareLocalVideo();
        const pc = createCallPeerConnection();

        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        isInCall = true;

        socket.emit("call-answer", {
          answer
        });

        setCallStatus("Video call is active");
      } catch (error) {
        console.log(error);
        setCallStatus("Video call failed");
        alert("Could not start camera or microphone.");
        endCall(false);
      }
    }

    async function acceptVoiceCall(data) {
      try {
        setCallStatus("تم قبول المكالمة...");
        await loadIceConfig();
        const stream = await prepareLocalAudio();
        const pc = createCallPeerConnection();

        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        isInCall = true;

        socket.emit("call-answer", {
          answer
        });

        setCallStatus("المكالمة تعمل الآن");
      } catch (error) {
        console.log(error);
        setCallStatus("فشل قبول المكالمة");
        alert("تعذر تشغيل الميكروفون لقبول المكالمة.");
        endCall(false);
      }
    }

    function endCall(emitEvent = true) {
      stopIncomingRingtone();
      if (callPeerConnection) {
        callPeerConnection.close();
        callPeerConnection = null;
      }

      if (localCallStream) {
        localCallStream.getTracks().forEach(track => track.stop());
        localCallStream = null;
      }

      isInCall = false;

      const audio = document.getElementById("remoteCallAudio");
      if (audio) audio.srcObject = null;

      const localVideo = document.getElementById("localCallVideo");
      if (localVideo) localVideo.srcObject = null;

      const remoteVideo = document.getElementById("remoteCallVideo");
      if (remoteVideo) remoteVideo.srcObject = null;

      const videoBox = document.getElementById("videoCallBox");
      if (videoBox) videoBox.style.display = "none";

      setCallStatus("تم إنهاء المكالمة");

      if (emitEvent) {
        socket.emit("call-end", {});
      }
    }

    let pendingIncomingCallData = null;

    let incomingRingInterval = null;
    let incomingRingAudioContext = null;

    function startIncomingRingtone() {
      stopIncomingRingtone();

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        incomingRingAudioContext = new AudioContextClass();

        const ringOnce = function() {
          if (!incomingRingAudioContext) return;

          const osc = incomingRingAudioContext.createOscillator();
          const gain = incomingRingAudioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(880, incomingRingAudioContext.currentTime);

          gain.gain.setValueAtTime(0.0001, incomingRingAudioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.22, incomingRingAudioContext.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, incomingRingAudioContext.currentTime + 0.55);

          osc.connect(gain);
          gain.connect(incomingRingAudioContext.destination);

          osc.start();
          osc.stop(incomingRingAudioContext.currentTime + 0.6);
        };

        ringOnce();
        incomingRingInterval = setInterval(ringOnce, 1200);
      } catch (error) {
        console.log("Ringtone blocked or failed:", error);
      }
    }

    function stopIncomingRingtone() {
      if (incomingRingInterval) {
        clearInterval(incomingRingInterval);
        incomingRingInterval = null;
      }

      if (incomingRingAudioContext) {
        incomingRingAudioContext.close().catch(() => {});
        incomingRingAudioContext = null;
      }
    }


    function showIncomingCallPopup(data) {
      pendingIncomingCallData = data;
      const overlay = document.getElementById("incomingCallOverlay");
      const icon = document.getElementById("incomingCallIcon");
      const title = document.getElementById("incomingCallTitle");
      const text = document.getElementById("incomingCallText");

      const fromName = data && data.from ? data.from : "مستخدم";
      const isVideoCall = data && data.type === "video";

      if (icon) icon.textContent = isVideoCall ? "📹" : "📞";
      if (title) title.textContent = isVideoCall ? "مكالمة فيديو واردة" : "مكالمة صوتية واردة";
      if (text) text.textContent = "مكالمة واردة من: " + fromName;

      if (overlay) overlay.style.display = "flex";
      startIncomingRingtone();
      setCallStatus("مكالمة واردة من " + fromName);
    }

    function hideIncomingCallPopup() {
      stopIncomingRingtone();
      const overlay = document.getElementById("incomingCallOverlay");
      if (overlay) overlay.style.display = "none";
    }

    async function acceptIncomingCallPopup() {
      const data = pendingIncomingCallData;
      pendingIncomingCallData = null;
      hideIncomingCallPopup();

      if (!data) return;

      const isVideoCall = data.type === "video";
      if (isVideoCall) {
        await acceptVideoCall(data);
      } else {
        await acceptVoiceCall(data);
      }
    }

    function rejectIncomingCallPopup() {
      pendingIncomingCallData = null;
      hideIncomingCallPopup();
      socket.emit("call-reject", {});
      setCallStatus("تم رفض المكالمة");
    }
    socket.on("call-offer", async function(data) {
      if (!data || !data.offer) return;

      if (isInCall) {
        socket.emit("call-reject", {});
        setCallStatus("تم رفض المكالمة لأنك داخل مكالمة أخرى");
        return;
      }

      showIncomingCallPopup(data);
    });

    socket.on("call-answer", async function(data) {
      if (!data || !callPeerConnection) return;

      try {
        await callPeerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        setCallStatus("المكالمة تعمل الآن");
      } catch (error) {
        console.log(error);
        setCallStatus("فشل إكمال المكالمة");
      }
    });

    socket.on("call-ice-candidate", async function(data) {
      if (!data || !data.candidate || !callPeerConnection) return;

      try {
        await callPeerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      } catch (error) {
        console.log(error);
      }
    });

    socket.on("call-reject", function(data) {
      pendingIncomingCallData = null;
      hideIncomingCallPopup();
      setCallStatus((data && data.from ? data.from : "الطرف الآخر") + " رفض المكالمة");
      endCall(false);
    });

    socket.on("call-end", function(data) {
      pendingIncomingCallData = null;
      hideIncomingCallPopup();
      setCallStatus((data && data.from ? data.from : "الطرف الآخر") + " أنهى المكالمة");
      endCall(false);
    });


    function clearCurrentRoomMessages() {
      if (!currentRoom) return;

      const ok = confirm("هل تريد مسح رسائل هذه المحادثة فقط؟");
      if (!ok) return;

      socket.emit("clear room messages", {
        room: currentRoom
      });
    }

    socket.on("messages cleared", function(data) {
      if (!data || !data.room) return;

      messagesByRoom[data.room] = [];

      const last = document.getElementById("last-" + data.room);
      if (last) {
        last.innerText = "لا توجد رسائل";
      }

      if (data.room === currentRoom) {
        document.getElementById("messages").innerHTML = "";
        addSystemMessage("تم مسح رسائل هذه المحادثة");
      }

      refreshChatList();
    });
    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function sendTyping() {
      if (!currentRoom) return;

      socket.emit("typing");

      clearTimeout(window.typingTimer);
      window.typingTimer = setTimeout(() => {
        socket.emit("stop typing");
      }, 900);
    }

    function renderRoomMessages(room) {
      const messages = document.getElementById("messages");
      messages.innerHTML = "";

      if (!messagesByRoom[room]) {
        messagesByRoom[room] = [];
      }

      messagesByRoom[room].forEach(addMessageToScreen);
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessageToScreen(data) {
      const messages = document.getElementById("messages");
      const row = document.createElement("div");
      const bubble = document.createElement("div");

      const isMe = data.name === username;

      row.className = isMe ? "row me" : "row other";
      bubble.className = "bubble";

      let content = "";

      if (data.type === "image" && data.image) {
        content = `
          ${isMe ? "" : `<div class="sender">${data.name}</div>`}
          <img class="chatImage" src="${data.image}" onclick="openImageViewer('${data.image}')" />
          <div class="time">${data.time}</div>
        `;
      } else if (data.type === "audio" && data.audio) {
        content = `
          ${isMe ? "" : `<div class="sender">${data.name}</div>`}
          <audio class="audioMessage" controls src="${data.audio}"></audio>
          <div class="time">${data.time}</div>
        `;
      } else {
        content = `
          ${isMe ? "" : `<div class="sender">${data.name}</div>`}
          <div>${data.text}</div>
          <div class="time">${data.time}</div>
        `;
      }

      bubble.innerHTML = content;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function openImageViewer(src) {
      document.getElementById("viewerImage").src = src;
      document.getElementById("imageViewer").style.display = "flex";
    }

    function closeImageViewer() {
      document.getElementById("imageViewer").style.display = "none";
      document.getElementById("viewerImage").src = "";
    }

    function addSystemMessage(text) {
      const messages = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "system";
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function filterChats(value) {
      const items = document.querySelectorAll(".chatItem");
      const q = value.trim();

      items.forEach(item => {
        const name = item.getAttribute("data-name");
        item.style.display = name.includes(q) ? "flex" : "none";
      });
    }

    socket.on("online users", function(users) {
      if (!Array.isArray(users) || !username) return;

      onlinePrivateChats = users
        .filter(function(user) {
          return user && user.name && user.name !== username;
        })
        .map(function(user) {
          return {
            id: makePrivateRoomId(username, user.name),
            name: "خاص: " + user.name,
            avatar: "👤"
          };
        });

      refreshChatList();
    });

    socket.on("room history", (data) => {
      if (!messagesByRoom[data.room]) {
        messagesByRoom[data.room] = [];
      }

      messagesByRoom[data.room] = data.messages || [];

      const last = document.getElementById("last-" + data.room);
      if (last && messagesByRoom[data.room].length > 0) {
        const latest = messagesByRoom[data.room][messagesByRoom[data.room].length - 1];
        last.innerText = latest.name + ": " + (latest.type === "image" ? "📷 صورة" : latest.type === "audio" ? "🎤 رسالة صوتية" : latest.text);
      }

      if (data.room === currentRoom) {
        renderRoomMessages(data.room);
      }
    });

    socket.on("chat message", (data) => {
      if (!messagesByRoom[data.room]) {
        messagesByRoom[data.room] = [];
      }

      messagesByRoom[data.room].push(data);

      const last = document.getElementById("last-" + data.room);
      if (last) {
        last.innerText = data.name + ": " + (data.type === "image" ? "📷 صورة" : data.type === "audio" ? "🎤 رسالة صوتية" : data.text);
      }

      if (data.room === currentRoom) {
        unreadCounts[data.room] = 0;
        addMessageToScreen(data);
      } else {
        unreadCounts[data.room] = (unreadCounts[data.room] || 0) + 1;
        refreshChatList();
      }
    });

    socket.on("system message", (data) => {
      if (currentRoom) {
        addSystemMessage(data.text);
      }
    });

    socket.on("typing", (name) => {
      if (currentRoom) {
        document.getElementById("typing").innerText = name + " يكتب الآن...";
      }
    });

    socket.on("stop typing", () => {
      document.getElementById("typing").innerText = "";
    });
  </script>

  <script>
    (function () {
      const LANG_KEY = "localchat_language";

      const statusMap = {
        "جاهز للمكالمة": "Ready to call",
        "جاري بدء المكالمة...": "Starting call...",
        "جاري الاتصال...": "Calling...",
        "فشل تشغيل الميكروفون": "Microphone failed",
        "Starting video call...": "Starting video call...",
        "Calling with video...": "Calling with video...",
        "Camera failed": "Camera failed",
        "Video call accepted...": "Video call accepted...",
        "Video call is active": "Video call is active",
        "Video call failed": "Video call failed",
        "تم قبول المكالمة...": "Call accepted...",
        "المكالمة تعمل الآن": "Call is active",
        "فشل قبول المكالمة": "Failed to accept call",
        "تم إنهاء المكالمة": "Call ended",
        "تم رفض المكالمة": "Call rejected",
        "تم رفض المكالمة لأنك داخل مكالمة أخرى": "Call rejected because you are already in another call"
      };

      function getLang() {
        return localStorage.getItem(LANG_KEY) || "ar";
      }

      function trStatus(text) {
        const lang = getLang();
        if (lang === "ar") return text;
        if (!text) return text;

        if (statusMap[text]) return statusMap[text];

        if (text.includes("مكالمة واردة من ")) {
          return text.replace("مكالمة واردة من ", "Incoming call from ");
        }

        if (text.includes(" رفض المكالمة")) {
          return text.replace(" رفض المكالمة", " rejected the call");
        }

        if (text.includes(" أنهى المكالمة")) {
          return text.replace(" أنهى المكالمة", " ended the call");
        }

        return text;
      }

      window.applyAppLanguage = function (lang) {
        localStorage.setItem(LANG_KEY, lang);

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.body.dir = lang === "ar" ? "rtl" : "ltr";

        const btn = document.getElementById("languageToggleBtn");
        if (btn) btn.textContent = "🌐 Language";

        const voiceBtn = document.querySelector('button[onclick="startVoiceCall()"]');
        if (voiceBtn) voiceBtn.textContent = lang === "ar" ? "📞 مكالمة صوتية" : "📞 Voice Call";

        const videoBtn = document.querySelector('button[onclick="startVideoCall()"]');
        if (videoBtn) videoBtn.textContent = lang === "ar" ? "📹 مكالمة فيديو" : "📹 Video Call";

        const endBtn = document.querySelector('button[onclick="endCall()"]');
        if (endBtn) endBtn.textContent = lang === "ar" ? "إنهاء" : "End";

        const acceptBtn = document.querySelector(".acceptIncomingCallBtn");
        if (acceptBtn) acceptBtn.textContent = lang === "ar" ? "قبول" : "Accept";

        const rejectBtn = document.querySelector(".rejectIncomingCallBtn");
        if (rejectBtn) rejectBtn.textContent = lang === "ar" ? "رفض" : "Reject";

        const callStatus = document.getElementById("callStatus");
        if (callStatus && callStatus.textContent.trim() === "جاهز للمكالمة") {
          callStatus.textContent = lang === "ar" ? "جاهز للمكالمة" : "Ready to call";
        }
      };

      window.toggleAppLanguage = function () {
        const nextLang = getLang() === "ar" ? "en" : "ar";
        window.applyAppLanguage(nextLang);
      };

      window.addEventListener("load", function () {
        window.applyAppLanguage(getLang());

        if (typeof window.setCallStatus === "function" && !window.setCallStatus.__languageWrapped) {
          const originalSetCallStatus = window.setCallStatus;
          window.setCallStatus = function (text) {
            originalSetCallStatus(trStatus(text));
          };
          window.setCallStatus.__languageWrapped = true;
        }

        if (typeof window.showIncomingCallPopup === "function" && !window.showIncomingCallPopup.__languageWrapped) {
          const originalShowIncomingCallPopup = window.showIncomingCallPopup;
          window.showIncomingCallPopup = function (data) {
            originalShowIncomingCallPopup(data);

            const lang = getLang();
            if (lang !== "en") return;

            const title = document.getElementById("incomingCallTitle");
            const text = document.getElementById("incomingCallText");
            const fromName = data && data.from ? data.from : "User";
            const isVideoCall = data && data.type === "video";

            if (title) title.textContent = isVideoCall ? "Incoming video call" : "Incoming voice call";
            if (text) text.textContent = "Incoming call from: " + fromName;
          };
          window.showIncomingCallPopup.__languageWrapped = true;
        }
      });
    })();
  </script>
  <script>
    function toggleLanguageMenu() {
      const box = document.getElementById("worldLanguageBox");
      if (!box) return;
      box.classList.toggle("open");
    }

    document.addEventListener("click", function(e) {
      const box = document.getElementById("worldLanguageBox");
      const btn = document.getElementById("languageToggleBtn");
      if (!box || !btn) return;

      if (box.contains(e.target) || btn.contains(e.target)) return;
      box.classList.remove("open");
    });
  </script>
