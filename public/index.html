<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Local Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00a884">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b141a;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .topbar {
      height: 68px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 1px solid #111b21;
    }

    .back {
      display: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #8696a0;
      margin-top: 4px;
    }

    .nameScreen {
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #202c33;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .card p {
      margin: 0 0 22px;
      color: #aebac1;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a3942;
      background: #111b21;
      color: white;
      outline: none;
      font-size: 17px;
      text-align: right;
    }

    .mainBtn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #00a884;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .chatList {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #111b21;
    }

    .searchBox {
      padding: 12px;
      background: #111b21;
    }

    .searchBox input {
      background: #202c33;
      border: none;
      border-radius: 20px;
      padding: 13px 16px;
      font-size: 15px;
    }

    .chatItem {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-bottom: 1px solid #202c33;
      cursor: pointer;
      background: #111b21;
    }

    .chatItem:hover {
      background: #182229;
    }

    .chatItem .avatar {
      width: 50px;
      height: 50px;
    }

    .chatText {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .lastMsg {
      color: #8696a0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chatTime {
      color: #8696a0;
      font-size: 12px;
    }

    .chatMeta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 42px;
    }

    .unreadBadge {
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #00a884;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chatItem.unread {
      background: #14242b;
    }

    .chatItem.unread .chatName {
      color: #ffffff;
    }

    .chatItem.unread .lastMsg {
      color: #d9fdd3;
      font-weight: bold;
    }

    .chatScreen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .callPanel {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #111b21;
      border-bottom: 1px solid #2a3942;
    }

    .callPanel button {
      border: none;
      border-radius: 18px;
      padding: 8px 12px;
      background: #00a884;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .callPanel .endCallBtn {
      background: #d93025;
    }

    #callStatus {
      color: #d9fdd3;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      background: #0b141a;
    }

    .row {
      display: flex;
      margin-bottom: 9px;
      width: 100%;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.other {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 11px;
      line-height: 1.45;
      font-size: 16px;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .me .bubble {
      background: #005c4b;
      border-top-right-radius: 2px;
    }

    .other .bubble {
      background: #202c33;
      border-top-left-radius: 2px;
    }

    .sender {
      color: #00a884;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .time {
      color: #aebac1;
      font-size: 11px;
      text-align: left;
      margin-top: 4px;
    }

    .chatImage {
      max-width: 230px;
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-top: 5px;
      cursor: pointer;
    }

    .system {
      text-align: center;
      color: #8696a0;
      font-size: 13px;
      margin: 10px 0;
    }

    #typing {
      height: 22px;
      padding: 2px 16px;
      font-size: 13px;
      color: #00a884;
      background: #0b141a;
    }

    .sendbar {
      background: #202c33;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sendbar input[type="text"] {
      flex: 1;
      border: none;
      border-radius: 24px;
      background: #2a3942;
      padding: 14px 16px;
      font-size: 16px;
    }

    .sendbar button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .imageBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn {
      background: #2a3942 !important;
      font-size: 22px !important;
    }

    .voiceBtn.recording {
      background: #d93025 !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .audioMessage {
      width: 230px;
      max-width: 100%;
      margin-top: 6px;
    }

    #imageInput {
      display: none;
    }

    .imageViewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .imageViewer img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
    }

    .closeViewer {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #202c33;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 24px;
      cursor: pointer;
    }

    @media (min-width: 800px) {
      body {
        background: #0a1014;
        display: flex;
        justify-content: center;
      }

      .app {
        max-width: 520px;
        width: 100%;
        border-left: 1px solid #2a3942;
        border-right: 1px solid #2a3942;
      }
    }
    .deleteBtn {
    background: #2a3942;
    color: #ff6b6b;
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
  }

  .deleteBtn:hover {
    background: #3b4a54;
  }
  
    .videoCallBox {
      display: none;
      gap: 8px;
      padding: 8px;
      background: #0b141a;
      border-bottom: 1px solid #2a3942;
    }

    .videoCallBox video {
      width: 48%;
      max-height: 180px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }
      .incomingCallOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .incomingCallCard {
      width: min(360px, 100%);
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      text-align: center;
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    .incomingCallIcon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 34px;
    }

    .incomingCallTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111827;
    }

    .incomingCallText {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .incomingCallActions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .incomingCallActions button {
      border: 0;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      min-width: 110px;
    }

    .acceptIncomingCallBtn {
      background: #16a34a;
      color: white;
    }

    .rejectIncomingCallBtn {
      background: #dc2626;
      color: white;
    }
      .languageToggleBox {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 99998;
    }

    .languageToggleBtn {
      border: 0;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .languageToggleBtn:hover {
      background: #2563eb;
    }
      .worldLanguageBox {
      position: fixed;
      top: 58px;
      left: 14px;
      z-index: 99998;
      background: rgba(255,255,255,0.96);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.16);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .worldLanguageBox select {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      max-width: 190px;
      background: white;
    }

    .worldLanguageBox button {
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .worldLanguageBox button:hover {
      background: #1d4ed8;
    }
      /* Clean unified language menu */
    .languageToggleBox {
      position: fixed !important;
      top: 14px !important;
      left: 14px !important;
      z-index: 100000 !important;
    }

    .languageToggleBtn {
      border: 0 !important;
      border-radius: 999px !important;
      background: #111827 !important;
      color: #ffffff !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18) !important;
    }

    .worldLanguageBox {
      position: fixed !important;
      top: 58px !important;
      left: 14px !important;
      z-index: 99999 !important;
      background: rgba(255,255,255,0.98) !important;
      border-radius: 16px !important;
      padding: 10px !important;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18) !important;
      display: none;
      gap: 7px !important;
      align-items: center !important;
      max-width: calc(100vw - 28px) !important;
    }

    .worldLanguageBox.open {
      display: flex !important;
    }
  
    .refreshPageBtn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #2a3942;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .refreshPageBtn:hover {
      background: #00a884;
    }
</style>
